[project]
name = "ka-rf-designer"
version = "0.1.0"
description = "Ka-band RF component compatibility and link-budget design MVP"
requires-python = ">=3.9"
dependencies = [
  "openpyxl>=3.1,<4",
  "pandas>=2.0,<3",
  "streamlit>=1.40,<2",
  "requests>=2.32,<3",
  "urllib3>=1.26,<2",
  "beautifulsoup4>=4.12,<5",
  "pypdf>=5,<7",
  "pymupdf>=1.24,<2",
  "pytesseract>=0.3.13,<1",
  "pillow>=10,<12",
  "playwright>=1.50,<2",
  "tenacity>=9,<10",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
